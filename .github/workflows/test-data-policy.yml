# OSIRIS JSON Producers Test Data Policy.
#
# Runs the repository test data policy scanner over every file in the
# Git index: approved example addresses, MACs, hostnames, device names,
# coordinates, sites, AS numbers, serial numbers and credentials, plus
# the reviewed allowlist.
name: Test Data Policy

on:
  push:
    branches: [main, dev, 'feat/**', 'feature/**']

  pull_request:
    branches: [main, dev]
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-data-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-data-policy:
    name: Test Data Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require a complete checkout
        run: |
          if [ "$(git config --get core.sparseCheckout || echo false)" != "false" ]; then
            echo "sparse checkout detected: the policy must see every tracked file" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the Test Data Policy
        run: go test ./internal/policies/testdatapolicy -run TestRepositoryDataPolicy -count=1 -v

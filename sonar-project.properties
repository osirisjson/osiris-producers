# SonarCloud analysis settings for the OSIRIS JSON producers Go module.
# Coverage is imported from the coverage.out report produced in CI.

sonar.projectKey=osirisjson_osiris-producers
sonar.organization=osirisjson

# Production code: everything except Go tests and test fixtures
sonar.sources=.
sonar.exclusions=**/*_test.go,**/testdata/**

# Test code: Go test files only
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclude ALL project files from duplication checks
sonar.cpd.exclusions=**/*
